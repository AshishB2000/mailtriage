# mailtriage config. Written by the setup wizard, committed on purpose --
# GitHub Actions checks it out and reads it. It holds no secrets.
# Edit it by hand any time, or re-run the wizard to overwrite it.

# What actually matters -- what counts as needing your action. Handed to
# the model verbatim.
interests: |
  Mail that needs a decision or a reply from me: direct questions from
  people I work with, meeting requests, anything with a deadline, invoices
  or bills that need action, and account/security alerts about my own
  accounts. If a human is waiting on me, it belongs in the digest.

# What's noise -- what to drop on the floor. Read as a hard filter.
avoid: |
  Purchase receipts and shipping notifications, automated "your build
  passed/failed" or monitoring alerts, marketing and promotional email,
  newsletters and digests you only skim, and social-media notifications.

# MAX number of items in a digest. Fewer is fine -- a quiet window
# should be short, not padded.
reading_count: 8

# How far back to look, in hours. Must be >= the largest gap between two
# consecutive run_at slots below (+1h slack), or mail published inside the
# gap is skipped forever. Overlap is harmless; a gap is not. A warning prints
# to stderr if this is too small; it does not stop the run. 15 = the default
# run_at slots' 14h overnight gap (18:00 to next day's 08:00) + 1h slack.
# The setup wizard computes this for you from run_at below every time it
# writes this file -- if you edit run_at by hand, update this by hand too.
window_hours: 15

# Daily digest times, "HH:MM" 24h, local to `timezone` below. Pick as many as
# you like. .github/workflows/digest.yml runs hourly and only actually
# triages during the hour after one of these -- that's what lets everyone
# have their own schedule without editing the workflow file (which would
# need the wizard to have write access it doesn't ask for).
run_at: ["08:00", "18:00"]

# IANA time zone name (e.g. "America/New_York", "Europe/London") that run_at
# and weekly_review are interpreted in. See
# https://en.wikipedia.org/wiki/List_of_tz_database_time_zones for the list.
timezone: "UTC"

# Blank = off. Otherwise "<mon|tue|wed|thu|fri|sat|sun> HH:MM" for a weekly
# roundup on top of the daily run_at slots. Not implemented yet -- the slot
# is recognized but currently just skips, same as an off-hour.
weekly_review: ""

# "email" (via Resend) or "gmail" (via your own Gmail's SMTP).
#
# email  — requires the RESEND_API_KEY secret. email_from must be on a domain
#          you have verified with Resend (https://resend.com/domains). Until
#          you verify one, use Resend's shared sender "onboarding@resend.dev"
#          — it needs no domain setup, but can only deliver to your own
#          Resend-account email (set that as email_to). Can send to anyone.
# gmail  — no Resend account needed. Sends through your own Gmail via SMTP,
#          using the app password you already set for reading that inbox
#          (MAIL_PW_* — see MAIL_ACCOUNTS). email_from must be one of your
#          Gmail addresses and its MAIL_PW_* secret must be set. Best when
#          emailing yourself: mail from your Gmail to your Gmail lands in
#          the inbox, no domain to verify, no spam flag.
delivery: gmail

# Addresses go in the EMAIL_TO / EMAIL_FROM repo secrets, not here -- this
# file is committed and this repo is public. The secrets override whatever
# is written below; leave both blank here. For `delivery: gmail`, leaving
# both EMAIL_TO and EMAIL_FROM unset too auto-sends from (and to) the first
# MAIL_ACCOUNTS address, so setting up gmail delivery needs no address at
# all. `delivery: email` (Resend) has no such fallback -- a verified sender
# can't be guessed, so both secrets are required.
email_to: ""
email_from: ""

subject_prefix: "mailtriage"

# Which AI backend triages your mail. "auto" (default) picks the first one
# whose secret is set, in this order: CLAUDE_CODE_OAUTH_TOKEN,
# ANTHROPIC_API_KEY, CODEX_AUTH_JSON, OPENAI_API_KEY, GEMINI_API_KEY,
# GEMINI_OAUTH_JSON. Set this explicitly to force one: "claude-subscription",
# "claude-api", "chatgpt-subscription", "openai-api", "gemini-api", or
# "google-subscription". See README.md.
provider: "auto"

# Overrides the chosen provider's default model when non-empty. Leave blank
# unless you have a specific reason to pin a different model.
model: ""

# AI drafts a reply for every needs-action email -- into the digest and your
# Gmail drafts folder; never sends.
draft_replies: true

# Reply tone/sign-off/language/length for AI-drafted replies. Any key you
# omit keeps its default below. "language" is "auto" (match the sender's
# language) unless set to a specific language name.
draft_style:
  tone: friendly # friendly | formal | casual
  sign_off: "" # e.g. "Best, Alex" -- overrides the generic "Thanks,"
  language: auto # or a language name, e.g. "French"
  max_sentences: 5

# Hard rules you set by hand -- checked deterministically, no API call.
# Entries are a full address ("boss@corp.com") or a domain starting with "@"
# ("@corp.com", which also matches its subdomains).
# rules:
#   always_ignore: ["newsletter@example.com"]  # dropped before the model ever sees them
#   always_surface: ["@vip-client.com"]        # always worth_reading, bypasses reading_count
#   always_action: ["boss@corp.com"]           # always needs_action, wins over always_ignore
rules:
  always_ignore: []
  always_surface: []
  always_action: []

# Per-account overrides, keyed by the account's address (case-insensitive).
# Each entry may set interests/avoid (added to the global ones above) and/or
# draft_style (merged over the global draft_style above).
# accounts:
#   work@corp.com:
#     interests: |
#       Anything from the eng-leads mailing list counts as needing action.
#     draft_style:
#       tone: formal
accounts: {}
# Re-list a needs-action email in every digest until it's handled. Cleared
# three ways: reply to it, archive it, or remove the Gmail label below. The
# label itself is the memory -- no state of any kind is kept in this repo.
carry_over: true

# The Gmail label the engine applies to needs-action mail so it can find it
# again next run. A "/" nests it under a parent in Gmail's sidebar (this
# shows as mailtriage -> action) -- that's intended.
label: "mailtriage/action"
