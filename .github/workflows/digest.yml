name: digest

# Two runs a day, evenly split at 12h apart (00:00 and 12:00 UTC). config.yaml's
# window_hours is 13, so this leaves an hour of slack for scheduler drift.
#
# Two things about GitHub's scheduler you should know before filing a bug:
#  1. It drifts. A run can fire 5-20 minutes late, occasionally more, and
#     under heavy load it can be skipped entirely.
#  2. Scheduled workflows are auto-disabled after 60 days with no commits to
#     the repo. GitHub emails you first. Push anything, or hit "Run workflow",
#     to wake it back up.
# Both are why config.yaml's window_hours has slack built in.
on:
  schedule:
    - cron: "0 0 * * *"    # 00:00 UTC
    - cron: "0 12 * * *"   # 12:00 UTC
  workflow_dispatch:

permissions:
  contents: read

# Never let a slow run and the next scheduled run overlap -- that sends the
# same digest twice. Queue instead of cancelling: a started run should finish.
concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The `secrets` context is not allowed in a step-level `if:`, but it IS
    # allowed in a job-level `env:`. Hoist the test here, then the steps below
    # gate on `env.HAS_SUBSCRIPTION` instead.
    env:
      HAS_SUBSCRIPTION: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Runtime deps come from pyproject.toml -- one source of truth, so the
      # pins here cannot drift from the ones a contributor installs locally.
      - run: pip install .

      # Its own step on purpose: a logic regression fails here, loudly and
      # before any API spend, instead of quietly producing a strange digest.
      - name: Self-check
        run: mailtriage --self-check

      # AI auth: exactly one of ANTHROPIC_API_KEY (pay-per-use API) or
      # CLAUDE_CODE_OAUTH_TOKEN (Claude Pro/Max subscription, no API bill).
      # Subscription mode needs the claude CLI on the runner -- installed
      # below, only when that secret is set.
      - name: Install Claude Code CLI (subscription mode only)
        if: env.HAS_SUBSCRIPTION == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install claude
        if: env.HAS_SUBSCRIPTION == 'true'
        run: npm install -g @anthropic-ai/claude-code

      # Secrets a forker sets: EITHER ANTHROPIC_API_KEY OR
      # CLAUDE_CODE_OAUTH_TOKEN (see above), plus RESEND_API_KEY,
      # MAIL_ACCOUNTS, and one MAIL_PW_<SLUG> per Gmail address
      # (imap_pull.py derives the slug from the address). The MAIL_PW_*
      # names are per-account and per-fork, so a static YAML step can't
      # enumerate them -- export the whole secrets bag into the environment
      # instead.
      - name: Send digest
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: |
          # Values stay masked in logs; shlex.quote prevents shell injection.
          eval "$(python -c 'import json,os,shlex; print("\n".join(f"export {k}={shlex.quote(v)}" for k,v in json.loads(os.environ["ALL_SECRETS"]).items() if k!="github_token"))')"
          mailtriage
