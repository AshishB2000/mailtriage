name: digest

# Runs HOURLY, on the hour's :17 rather than :00 -- GitHub's own docs warn
# that load spikes right at the top of every hour and queued jobs can get
# dropped there, so :17 dodges the crowd. The actual digest times are picked
# per-fork in config.yaml (`run_at` + `timezone`), not here: the "Is it
# time?" step below asks `mailtriage --due`, which is the only thing that
# knows the user's local schedule, and skips the rest of the job when it's
# not one of their slots. Rewriting this file's cron per-fork from the setup
# wizard would mean every user granting it the `workflow` PAT scope just to
# pick a time, so instead this file stays fixed and the gate does the work.
#
# Two things about GitHub's scheduler you should know before filing a bug:
#  1. It drifts (a run can fire 5-30 minutes late, occasionally more) and
#     under heavy load it skips hours outright (one run in five hours,
#     observed 2026-09-03). The gate accepts a slot for `catch_up_minutes`
#     (config.yaml, default 120) after it, so the hour after a skipped one
#     still sends that slot's digest. Because two hourly firings can then
#     both fall inside one slot's window, each scheduled digest's subject
#     carries its slot ("mailtriage · Thu 03 Sep 08:00 · ...") and the engine
#     looks for that subject in your own mailbox before sending -- a slot
#     never sends twice, with no state file. If a slot is missed for longer
#     than catch_up_minutes, its mail still arrives at the next slot:
#     window_hours overlaps between runs.
#  2. Scheduled workflows are auto-disabled after 60 days with no commits to
#     the repo. GitHub emails you first. Push anything, or hit "Run workflow",
#     to wake it back up.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

# Never let a slow run and the next scheduled run overlap -- that sends the
# same digest twice. Queue instead of cancelling: a started run should finish.
concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The `secrets` context is not allowed in a step-level `if:`, but it IS
    # allowed in a job-level `env:`. Hoist the test here, then the steps below
    # gate on `env.HAS_SUBSCRIPTION` / `env.HAS_CODEX` instead.
    env:
      HAS_SUBSCRIPTION: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
      HAS_CODEX: ${{ secrets.CODEX_AUTH_JSON != '' }}
      HAS_GEMINI_CLI: ${{ secrets.GEMINI_OAUTH_JSON != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      # Runtime deps come from pyproject.toml -- one source of truth, so the
      # pins here cannot drift from the ones a contributor installs locally.
      - run: pip install .

      # The hourly trigger fires every run; this decides whether *this* hour
      # is actually one of the user's run_at/weekly_review slots, and which
      # kind ("digest" or "weekly") it is. `--due` only evaluates the
      # schedule (no network, no IMAP): exit 0 with the mode printed on
      # stdout when due, exit 3 when not due, exit 1 on a real failure (e.g.
      # a broken config.yaml, which must fail the job loudly rather than
      # silently look like "not due"). A manual "Run workflow" click bypasses
      # the gate entirely: its `mode` input (default "digest") is the mode.
      #
      # Deliberately not `mailtriage --due && A || { [ $? -eq 3 ] && B; }`:
      # actionlint/shellcheck flags that shape (SC2015, "A && B || C is not
      # if-then-else") because B failing would fall through to C. The `case`
      # below captures the exit code once and branches on it explicitly, so
      # there's no A/B/C ambiguity to flag.
      - name: Is it time?
        id: gate
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          set +e
          mode=$(mailtriage --due)
          rc=$?
          set -e
          case "$rc" in
            0) echo "due=true" >> "$GITHUB_OUTPUT"; echo "mode=$mode" >> "$GITHUB_OUTPUT" ;;
            3) echo "due=false" >> "$GITHUB_OUTPUT" ;;
            *) exit "$rc" ;;
          esac

      # Its own step on purpose: a logic regression fails here, loudly and
      # before any API spend, instead of quietly producing a strange digest.
      - name: Self-check
        if: steps.gate.outputs.due == 'true'
        run: mailtriage --self-check

      # AI auth: config.yaml's `provider` (default "auto") picks one of six
      # backends by which secret is set -- see README.md for the full matrix.
      # The three subscription CLIs (claude, codex, gemini) need Node on the
      # runner; installed once below, only when one of those secrets is set.
      - name: Install Node (subscription CLIs)
        if: steps.gate.outputs.due == 'true' && (env.HAS_SUBSCRIPTION == 'true' || env.HAS_CODEX == 'true' || env.HAS_GEMINI_CLI == 'true')
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - name: Install claude
        if: steps.gate.outputs.due == 'true' && env.HAS_SUBSCRIPTION == 'true'
        run: npm install -g @anthropic-ai/claude-code
      - name: Install codex
        if: steps.gate.outputs.due == 'true' && env.HAS_CODEX == 'true'
        run: npm install -g @openai/codex
      - name: Install gemini
        if: steps.gate.outputs.due == 'true' && env.HAS_GEMINI_CLI == 'true'
        run: npm install -g @google/gemini-cli

      # Secrets a forker sets: ONE of the six AI-auth secrets (see above),
      # plus RESEND_API_KEY, MAIL_ACCOUNTS, and one MAIL_PW_<SLUG> per Gmail
      # address (imap_pull.py derives the slug from the address). The
      # MAIL_PW_* names are per-account and per-fork, so a static YAML step
      # can't enumerate them -- export the whole secrets bag into the
      # environment instead. This is also how CODEX_AUTH_JSON reaches
      # codex_cli.py -- it reads the env var directly, no separate step needed.
      - name: Send digest
        if: steps.gate.outputs.due == 'true'
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
          MODE: ${{ steps.gate.outputs.mode }}
        run: |
          # Values stay masked in logs; shlex.quote prevents shell injection.
          eval "$(python -c 'import json,os,shlex; print("\n".join(f"export {k}={shlex.quote(v)}" for k,v in json.loads(os.environ["ALL_SECRETS"]).items() if k!="github_token"))')"
          if [ "$MODE" = "weekly" ]; then
            mailtriage --weekly
          else
            mailtriage
          fi
      #
      # GITHUB_EVENT_NAME is what tells the engine a scheduled run from a
      # manual one: only scheduled digests get the slot stamp + double-send
      # guard described at the top of this file.
          GITHUB_EVENT_NAME: ${{ github.event_name }}
