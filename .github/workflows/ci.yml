name: ci

# Runs on every push and PR. The digest workflow only runs the self-check, on a
# schedule -- so without this, a logic regression sits unnoticed until the
# next run.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Plain YAML parsing does not validate Actions expressions — a `secrets`
  # reference in a step-level `if:` parses fine locally and is rejected by
  # GitHub at dispatch time (this happened; see CLAUDE.md landmines).
  # actionlint catches that whole class before merge.
  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Floor and ceiling: the workflow pins 3.12, but a fork may run anything.
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Types
        run: mypy

      # Same gate the digest workflow runs before any API spend. Kept separate
      # from pytest so a failure here is unambiguous in the logs.
      - name: Self-check
        run: mailtriage --self-check

      - name: Tests
        run: pytest
