name: ci

# Runs on every push and PR. The digest workflow only runs the self-check, on a
# schedule -- so without this, a logic regression sits unnoticed until the
# next run.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Floor and ceiling: the workflow pins 3.12, but a fork may run anything.
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Types
        run: mypy

      # Same gate the digest workflow runs before any API spend. Kept separate
      # from pytest so a failure here is unambiguous in the logs.
      - name: Self-check
        run: mailtriage --self-check

      - name: Tests
        run: pytest
