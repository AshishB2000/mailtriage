[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mailtriage"
version = "1.0.0"
description = "Twice-daily private AI triage of your Gmail inboxes, delivered as an HTML email. Fork-and-run on your own GitHub Actions."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["anthropic==0.120.2", "PyYAML==6.0.3"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11", "types-PyYAML"]

[project.scripts]
mailtriage = "mailtriage.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mailtriage"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Both blind excepts in imap_pull.py are deliberate: imaplib raises 6+ unrelated
# types on a bad login (caught per-account so one failure never blanks the run),
# and get_content() has a decode fallback. A dead account is expected, not
# exceptional.
ignore = ["BLE001"]

[tool.ruff.lint.per-file-ignores]
# The triage prompt is the product — long, unbroken sentences on purpose.
"src/mailtriage/triage.py" = ["E501"]
# Inline-styled HTML table rows — long lines on purpose.
"src/mailtriage/delivery/mail.py" = ["E501"]
# `as MailError` is a required explicit re-export under mypy's strict
# no-implicit-reexport, not a redundant alias.
"src/mailtriage/imap_pull.py" = ["PLC0414"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"

[tool.mypy]
python_version = "3.10"
files = ["src", "tests"]
strict = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
