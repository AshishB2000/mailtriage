[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mailtriage"
version = "1.0.0"
description = "Twice-daily private triage dashboard for several Gmail inboxes."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML"]   # config.yaml parsing; matches newsprint's contract

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
mailtriage = "mailtriage.imap_pull:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mailtriage"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Both blind excepts in imap_pull.py are deliberate: imaplib raises 6+ unrelated
# types on a bad login (caught per-account so one failure never blanks the run),
# and get_content() has a decode fallback. A dead account is expected, not
# exceptional.
ignore = ["BLE001"]

[tool.ruff.lint.per-file-ignores]
# The triage prompt is the product — long, unbroken sentences on purpose.
"src/mailtriage/triage.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
